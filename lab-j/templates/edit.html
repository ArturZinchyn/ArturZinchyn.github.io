{% extends "layout.html" %}

{% block content %}
<h2>Edycja broni</h2>
<form method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{ item['name'] }}" required>

    <label for="caliber">Caliber:</label>
    <input type="text" id="caliber" name="caliber" value="{{ item['caliber'] }}" required>

    <label for="magazine_capacity">Capacity:</label>
    <input type="number" id="magazine_capacity" name="magazine_capacity" value="{{ item['magazine_capacity'] }}" required>

    <button type="submit">Zapisz zmiany</button>
</form>
<br>
<a href="{{ url_for('index') }}">Powrót do listy</a>
{% endblock %}
