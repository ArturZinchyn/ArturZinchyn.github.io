{% extends "layout.html" %}

{% block content %}
<h2>Dodaj nową broń</h2>
<form method="POST">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="caliber">Caliber:</label><br>
    <input type="text" id="caliber" name="caliber" required><br><br>

    <label for="magazine_capacity">Capacity:</label><br>
    <input type="number" id="magazine_capacity" name="magazine_capacity" required><br><br>

    <button type="submit">Zapisz</button>
</form>
<br>
<a href="{{ url_for('index') }}">Powrót do listy</a>
{% endblock %}
